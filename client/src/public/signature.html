<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Message with Viem</title>
  <script type="module">
    import { 
      createWalletClient, 
      custom, 
      hashMessage, 
      recoverPublicKey, 
      verifyMessage
    } from 'https://esm.sh/viem'
    import { mainnet } from 'https://esm.sh/viem/chains'

    async function signText() {
      const sigData = document.getElementById('sigData')
      const pubKeyData = document.getElementById('pubKeyData')      
      const validData = document.getElementById('validData')
      const hashField = document.getElementById('hashField')
      const message = document.getElementById('message').value

      if (!window.ethereum) {
        alert('No wallet found. Please install MetaMask or another Ethereum wallet.')
        return
      }

      try {
        // Request wallet connection
        await window.ethereum.request({ method: 'eth_requestAccounts' })

        const walletClient = createWalletClient({
          chain: mainnet,
          transport: custom(window.ethereum),
        })

        const [myAddress] = await walletClient.getAddresses()

        const signature = await walletClient.signMessage({
          account: myAddress,
          message,
        })

        const pubKey = await recoverPublicKey({
          hash: hashMessage(message),
          signature, 
        })

      
        sigData.textContent = `${(signature.length-2)/2} bytes ${signature}`
        pubKeyData.textContent = `${(pubKey.length-2)/2} bytes ${pubKey}`
        hashField.textContent = `${hashMessage(message)}`        

        console.log(myAddress)

        const valid = await verifyMessage({
          address: myAddress,
          message,
          signature
        })

        validData.textContent = valid

      } catch (err) {
        console.error(err)
      }
    }

    window.signText = signText
  </script>
</head>
<body>
  <h1>Sign a Message with Viem</h1>
  <textarea id="message" rows="4" cols="50" placeholder="Enter your message here..."></textarea><br>
  <button onclick="signText()">Sign Message</button>
  <table border>
    <tr>
      <td>
        Signature:
      </td>
      <td>
        <pre id="sigData" />
      </td>
    </tr>
    <tr>
      <td>
        Public key:
      </td>
      <td>
        <pre id="pubKeyData" />
      </td>
    </tr>
    <tr>
      <td>
        Hash:
      </td>
      <td>
        <pre id="hashField" />
      </td>
    </tr>    
    <tr>
      <td>
        Valid?
      </td>
      <td>
        <pre id="validData" />
      </td>
    </tr>          
  </table>
</body>
</html>
